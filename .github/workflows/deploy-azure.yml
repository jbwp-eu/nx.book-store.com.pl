# Deploy to Azure App Service — nx.book-store.com.pl
# Secrets: AZURE_WEBAPP_PUBLISH_PROFILE, DATABASE_URL, NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
# Variables: AZURE_WEBAPP_NAME, DEPLOY_BASE_URL_AZURE (optional smoke URL)
#
# Publish profile: Azure Portal → App Service → Get publish profile (no CLI scripts).
# App settings / WebSockets / custom domain: configure in Azure Portal (see deploy-azure/README.md).
name: Deploy to Azure

on:
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install, generate Prisma client, build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.DEPLOY_BASE_URL_AZURE }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Prepare deploy package
        run: |
          mkdir -p deploy-package
          rsync -a \
            --exclude .git \
            --exclude e2e \
            --exclude test-results \
            --exclude playwright-report \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude '.env.production' \
            --exclude deploy-package \
            ./ deploy-package/
          # Production deps only (tsx is a runtime dependency for server.ts)
          cd deploy-package
          npm ci --omit=dev
          npx prisma generate

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-package

      - name: Smoke test (public URL)
        if: vars.DEPLOY_BASE_URL_AZURE != ''
        env:
          DEPLOY_BASE_URL_AZURE: ${{ vars.DEPLOY_BASE_URL_AZURE }}
        run: bash deploy-azure/smoke-test.sh
